<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AbfallRadar">
  <!--
    The browser-tab mark: the brand square of `packages/ui/src/brand-mark.tsx`, redrawn for 16 px.

    Original artwork, not a traced logo: three bold arrows around a triangle, which is what survives at
    a tab's size, where the product mark's thin 2.2 px strokes close up into a smudge. The palette is
    the shipped one, `ar-color-brand` over `ar-color-on-brand`, written literally because a favicon is
    loaded outside the document and inherits no custom property from it. The dark appearance's pairing
    is used in both: light green on near black reads on a light and a dark tab strip alike, and a
    favicon cannot follow the application's theme.

    Self contained on purpose: no stylesheet, no external reference, no script, no font, no wordmark.
  -->
  <rect width="64" height="64" rx="15" fill="#b7ef79"/>
  <!-- The glyph is scaled about the centre: at 16 px the arrows need the width the padding was using. -->
  <g transform="translate(32 32) scale(1.14) translate(-32 -32)">
  <g fill="none" stroke="#0c1110" stroke-width="7.5" stroke-linecap="round">
    <path d="M21 41h17"/>
    <path d="M21 41h17" transform="rotate(120 32 32)"/>
    <path d="M21 41h17" transform="rotate(240 32 32)"/>
  </g>
  <g fill="#0c1110">
    <path d="M37 33.5 49.5 41 37 48.5z"/>
    <path d="M37 33.5 49.5 41 37 48.5z" transform="rotate(120 32 32)"/>
    <path d="M37 33.5 49.5 41 37 48.5z" transform="rotate(240 32 32)"/>
  </g>
  </g>
</svg>
